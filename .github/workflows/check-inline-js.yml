name: FunBlok automatic tester

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-test:
    name: Run FunBlok checks
    runs-on: ubuntu-latest
    steps:
      - name: Get latest FunBlok code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run automatic FunBlok tester
        run: python scripts/auto-test.py

      - name: Run detailed inline JavaScript check
        run: python scripts/check-inline-js.py
